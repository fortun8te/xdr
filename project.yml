name: XDR
options:
  bundleIdPrefix: com.xdr
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    from: "1.0.0"

targets:
  XDR:
    type: application
    platform: macOS
    sources:
      - XDR
    settings:
      base:
        INFOPLIST_FILE: XDR/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: XDR/Resources/XDR.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: KeyboardShortcuts
      - package: LaunchAtLogin
    info:
      path: XDR/Resources/Info.plist
      properties:
        LSUIElement: false
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: XDR.sdef
        CFBundleName: XDR
        NSHumanReadableCopyright: "Copyright © 2024 XDR. All rights reserved."
